server:
  port: ${PORT:8080}
spring:
  application:
    name: foodflow
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/foodflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:ReplaceThisWithA256BitSecretKeyForFoodFlowJWTSigningPurposesOnly}
  expiration-ms: 86400000